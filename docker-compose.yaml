version: "3.9"

services:
  api:
    build: .
    container_name: crop_prediction_app
    ports:
      - "8000:8000"
    volumes:
      # for development sync into local code into container
      - ./app:/app/app
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/db:/docker-entrypoint-initdb.d 

volumes:
  mysql_data:
